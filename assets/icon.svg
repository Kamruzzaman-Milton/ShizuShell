<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="50%" stop-color="#0E1317" />
      <stop offset="100%" stop-color="#070A0D" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Terminal Chevron Gradient -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Cursor Underscore Gradient -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Soft Glow Filters -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#bgGrad)" filter="url(#outerShadow)" />
  <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Radial Ambient Glow behind symbols -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.12" />
    <stop offset="60%" stop-color="#10B981" stop-opacity="0.05" />
    <stop offset="100%" stop-color="#0E1317" stop-opacity="0" />
  </radialGradient>
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Elevated Shell Terminal Chevron ( `>` ) -->
  <path d="M 160 176 L 244 256 L 160 336"
        fill="none"
        stroke="url(#chevronGrad)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowEffect)" />

  <!-- Shizuku Elevated Privilege Lightning Bolt (Elevated ADB) -->
  <path d="M 324 160 L 286 230 L 322 230 L 294 300 L 358 214 L 324 214 Z"
        fill="url(#lightningGrad)"
        stroke="#E0F2FE"
        stroke-width="3"
        stroke-linejoin="round"
        filter="url(#glowEffect)" />

  <!-- Terminal Underscore Cursor ( `_` ) -->
  <line x1="264" y1="336" x2="352" y2="336"
        stroke="url(#cursorGrad)"
        stroke-width="34"
        stroke-linecap="round"
        filter="url(#glowEffect)" />
</svg>
